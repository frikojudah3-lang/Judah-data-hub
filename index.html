<!DOCTYPE html>
<html>
<head>
    <title>Friko Data Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Friko Data Hub</h1>
    <p>Buy MTN, Telecel and AirtelTigo Data Bundles</p>
</header>

<section class="buy-box">

    <h2>Buy Data</h2>

    <input type="text" id="phone" placeholder="Phone Number">

    <select id="network">
        <option value="MTN">MTN</option>
        <option value="Telecel">Telecel</option>
        <option value="AirtelTigo">AirtelTigo</option>
    </select>

    <select id="bundle">
        <option value="1GB">1GB - GH₵5</option>
        <option value="2GB">2GB - GH₵10</option>
        <option value="3GB">3GB - GH₵15</option>
        <option value="4GB">4GB - GH₵20</option>
        <option value="5GB">5GB - GH₵25</option>
        <option value="10GB">10GB - GH₵50</option>
         <option value="15GB">15GB - GH₵70</option>
    </select>

    <button onclick="buyData()">Buy Now</button>

</section>

<script src="script.js"></script>

<footer>
    <p>© 2026 Friko Data Hub</p>
</footer>

</body>
</html>
